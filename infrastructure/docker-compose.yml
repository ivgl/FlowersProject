version: '3.8'

services:
  db:
    image: postgres:14
    platform: linux/amd64
    container_name: plant_tracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant_user -d plant_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: plant_tracker_api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT}
      - FLASK_ENV=${FLASK_ENV}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local 